spring:
  application:
    name: enterprise-crm

  profiles:
    active: h2

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # El valor de la derecha (":...") es SOLO para desarrollo local. En cualquier
  # despliegue real, seteá la variable de entorno JWT_SECRET con un valor propio
  # generado - nunca reutilices este ni lo dejes como el secreto real en produccion.
  secret: ${JWT_SECRET:XdN2vFfiwfAIPxMgCLWdwH1hvi96jAC9lK34kaD3f2vDXcXR7vwuoRw2whdKGluYjhNRyrACvsvyKdOmKFX4xg==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    com.enterprise.crm.security: ${SECURITY_LOG_LEVEL:INFO}
