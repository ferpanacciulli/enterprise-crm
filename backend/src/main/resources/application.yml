spring:
  application:
    name: enterprise-crm

  profiles:
    active: h2

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: XdN2vFfiwfAIPxMgCLWdwH1hvi96jAC9lK34kaD3f2vDXcXR7vwuoRw2whdKGluYjhNRyrACvsvyKdOmKFX4xg==
  expiration-ms: 86400000

logging:
  level:
    org.springframework.security: DEBUG
    com.enterprise.crm.security: DEBUG
