name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Git no siempre preserva el bit de ejecutable de mvnw al pushear desde
      # Windows - sin esto, Linux (el runner) lo rechaza con "exit code 126".
      - name: Dar permiso de ejecución a mvnw
        working-directory: ./backend
        run: chmod +x ./mvnw

      - name: Compilar y correr tests
        working-directory: ./backend
        run: ./mvnw clean verify

      - name: Publicar resultados de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit
          path: 'backend/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-empty: false
